name: Release

# Build macOS (Apple Silicon + Intel) and Windows binaries on a version tag and
# attach them to a GitHub Release. Lets us produce all three without owning the
# hardware (GitHub provides arm64 + Intel macOS runners and a Windows runner).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    # macos-14 has a universal2 Python (via setup-python), so one build runs
    # natively on both Apple Silicon and Intel — no scarce Intel runner needed.
    runs-on: macos-14
    env:
      TLJ_UNIVERSAL: "1"
      # Signing/notarization run only when the repo secrets exist; without
      # them the build still succeeds but ships unsigned (Gatekeeper warns).
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mutagen internetarchive
      - name: Generate icons (Pillow is build-time only)
        run: |
          pip install pillow
          python assets/make_icon.py
          pip uninstall -y pillow   # keep it out of the universal2 bundle
      - name: Build universal .app
        run: |
          pyinstaller TradersLittleJedi.spec --noconfirm --clean
          pyinstaller WooksLittleHelper.spec --noconfirm
      - name: Verify universal2
        run: |
          BIN="dist/Trader's Little Jedi.app/Contents/MacOS/TradersLittleJedi"
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q "x86_64" && lipo -archs "$BIN" | grep -q "arm64" \
            && echo "OK: universal2" || { echo "NOT universal2"; exit 1; }
      - name: Bundle universal ffmpeg into Wook's Little Helper
        run: |
          mkdir -p ffwheels
          pip download imageio-ffmpeg --no-deps -d ffwheels \
            --platform macosx_11_0_arm64 --only-binary=:all: -q
          pip download imageio-ffmpeg --no-deps -d ffwheels \
            --platform macosx_10_9_x86_64 --only-binary=:all: -q
          cd ffwheels
          for w in *.whl; do unzip -o -q "$w" 'imageio_ffmpeg/binaries/ffmpeg-*' -d "${w%.whl}"; done
          ARM=$(ls */imageio_ffmpeg/binaries/ffmpeg-macos-aarch64-*)
          X86=$(ls */imageio_ffmpeg/binaries/ffmpeg-macos-x86_64-*)
          BIN="../dist/Wook's Little Helper.app/Contents/Resources/bin"
          mkdir -p "$BIN"
          lipo -create "$ARM" "$X86" -output "$BIN/ffmpeg"
          chmod +x "$BIN/ffmpeg"
          lipo -archs "$BIN/ffmpeg"
          "$BIN/ffmpeg" -version | head -1

      - name: Import Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PW=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PW" build.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain-db
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain-db \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PW" build.keychain-db
          ID=$(security find-identity -v -p codesigning build.keychain-db \
               | grep "Developer ID Application" | head -1 \
               | sed 's/.*"\(.*\)"/\1/')
          [ -n "$ID" ] || { echo "No Developer ID Application cert found"; exit 1; }
          echo "SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"

      - name: Code sign .app (hardened runtime)
        if: env.HAVE_SIGNING == 'true'
        run: |
          for APP in "dist/Trader's Little Jedi.app" "dist/Wook's Little Helper.app"; do
            [ -d "$APP/Contents/Resources/bin" ] && \
              find "$APP/Contents/Resources/bin" -type f -exec \
                codesign --force --sign "$SIGN_IDENTITY" \
                         --options runtime --timestamp {} \;
            find "$APP/Contents/MacOS" -type f -exec \
              codesign --force --sign "$SIGN_IDENTITY" \
                       --options runtime --timestamp {} \;
            find "$APP/Contents/Frameworks" \( -name "*.dylib" -o -name "*.so" \) 2>/dev/null | \
              xargs -I{} codesign --force --sign "$SIGN_IDENTITY" \
                                  --options runtime --timestamp {} || true
            codesign --deep --force --sign "$SIGN_IDENTITY" \
                     --options runtime --timestamp \
                     --entitlements assets/entitlements.plist "$APP"
            codesign --verify --deep --strict "$APP"
          done

      - name: Package .dmg
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          hdiutil create -volname "Trader's Little Jedi" \
            -srcfolder "dist/Trader's Little Jedi.app" \
            -ov -format UDZO \
            "dist/TradersLittleJedi-${TAG}-mac-universal.dmg"
          hdiutil create -volname "Wook's Little Helper" \
            -srcfolder "dist/Wook's Little Helper.app" \
            -ov -format UDZO \
            "dist/WooksLittleHelper-${TAG}-mac-universal.dmg"

      - name: Notarize and staple
        if: env.HAVE_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          for DMG in dist/*-mac-universal.dmg; do
            codesign --force --sign "$SIGN_IDENTITY" --timestamp "$DMG"
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$DMG"
          done
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/TradersLittleJedi-*-mac-universal.dmg
            dist/WooksLittleHelper-*-mac-universal.dmg
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow mutagen internetarchive tkinterdnd2
      - name: Generate icons
        run: python assets/make_icon.py
      - name: Build .exe
        run: pyinstaller TradersLittleJedi.spec --noconfirm --clean
      - name: Name the exe with the version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Copy-Item "dist/TradersLittleJedi.exe" "dist/TradersLittleJedi-$tag-windows.exe"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/setup.iss
        continue-on-error: true
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/TradersLittleJedi-*-windows.exe
            dist/TradersLittleJedi-Setup-*.exe
