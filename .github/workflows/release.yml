name: Release

# Build macOS (Apple Silicon + Intel) and Windows binaries on a version tag and
# attach them to a GitHub Release. Lets us produce all three without owning the
# hardware (GitHub provides arm64 + Intel macOS runners and a Windows runner).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.1)"
        required: true

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13      # Intel (x86_64)
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow mutagen internetarchive tkinterdnd2
      - name: Generate icons
        run: python assets/make_icon.py
      - name: Build .app
        run: pyinstaller TradersLittleJedi.spec --noconfirm --clean
      - name: Package .dmg
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          hdiutil create -volname "Trader's Little Jedi" \
            -srcfolder "dist/Trader's Little Jedi.app" \
            -ov -format UDZO \
            "dist/TradersLittleJedi-${TAG}-mac-${{ matrix.arch }}.dmg"
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/TradersLittleJedi-*-mac-${{ matrix.arch }}.dmg
          fail_on_unmatched_files: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow mutagen internetarchive tkinterdnd2
      - name: Generate icons
        run: python assets/make_icon.py
      - name: Build .exe
        run: pyinstaller TradersLittleJedi.spec --noconfirm --clean
      - name: Name the exe with the version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          Copy-Item "dist/TradersLittleJedi.exe" "dist/TradersLittleJedi-$tag-windows.exe"
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/setup.iss
        continue-on-error: true
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/TradersLittleJedi-*-windows.exe
            dist/TradersLittleJedi-Setup-*.exe
